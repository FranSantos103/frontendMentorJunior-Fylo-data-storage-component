<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fylo data storage component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <img src="images/logo.svg" alt="" class="logo">

 <div class="containerImages">
    <div class="icon">
      <img src="images/icon-document.svg" alt="" class="images">
    </div>
    <div class="icon">
      <img src="images/icon-folder.svg" alt="" class="images">
    </div>
    <div class="icon">
      <img src="images/icon-upload.svg" alt="" class="images">
    </div>
  </div>

  <div class="Largercontainer">
     <p class="planUsage">You've used <span>815 GB</span> of your storage</p>


      <div class="bar">
        <div class="blueBar">
          <div class="ball"></div>
        </div>
      </div>


<div class="tooltip">
  <span class="left185">185</span> <span>GB LEFT</span>
</div>

  <div class="plan">
    <p class="noGBleft">0 GB</p>
    <p class="fullPlan">1000 GB</p>
  </div>

</div>

 </div>
</body>
</html>
